name: Refresh YouTube profile pictures
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: youtube-avatar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve pilot channel pictures
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python refresh-youtube-avatars.py
      - name: Save public avatar metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pfp/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh YouTube avatar metadata'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Stage static website
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r assets css js data pfp _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed website
        id: deploy
        uses: actions/deploy-pages@v4

