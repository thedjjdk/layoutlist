/* V15: public player profiles and difficulty-completion packs */
.profile-hero{display:flex;align-items:center;gap:17px;margin-bottom:18px}
.profile-avatar{flex:0 0 66px;width:66px;height:66px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--accent)}
.profile-subtitle{color:var(--dim);font-size:12px;margin-top:5px}
.player-link{border:0;background:none;color:var(--accent);padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:750}
.player-link:hover{text-decoration-thickness:2px}
.player-link.inline-player{display:inline;font-size:inherit;font-weight:800}
.profile-list{display:flex;flex-direction:column;gap:8px}
.profile-record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px dashed var(--border);background:var(--surface2);font-size:12px}
.profile-record strong{font-size:13px}
.profile-record .record-meta{color:var(--dim);font-size:11px;margin-top:4px}
.profile-record .record-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}
.profile-note{font-size:12px;color:var(--dim);line-height:1.6}
.pack-progress-track{height:8px;background:var(--surface2);border:1px solid var(--border);margin:10px 0 7px;overflow:hidden}
.pack-progress-fill{height:100%;background:var(--accent);transition:width .25s ease}
.pack-status{font-size:11px;color:var(--dim);line-height:1.6}
.pack-earned{border-color:var(--accent) !important}
.pack-earned-label{background:var(--accent-button);color:#fff;display:inline-block;padding:3px 7px;font-size:10px;font-weight:850;letter-spacing:.35px;margin-bottom:8px}
.pack-head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.pack-head h3{margin:0}
.pack-count{font-size:11px;color:var(--dim)}
.profile-packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.profile-packs .pack{min-width:0}
.pack-cta{border:0;background:none;color:var(--accent);text-align:left;padding:5px 0;font-size:12px;font-weight:750;cursor:pointer}
.pack-cta:hover{text-decoration:underline}
.pack-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pack-filter .filter{width:min(100%,310px)}
.pack-people{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 0}
.pack-people button{padding:5px 9px;border:1px dashed var(--border);background:var(--surface2);font-size:11px;color:var(--text)}
.pack-people button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.pack-entry{font-size:12px;color:var(--text);margin:7px 0}
.pack-entry button{display:inline;color:var(--accent);font-size:inherit}
.profile-empty{font-size:12px;color:var(--dim);padding:14px;border:1px dashed var(--border)}
body.light-mode .profile-record,body.light-mode .profilestat,body.light-mode .pack,body.light-mode .pack-people button{background:#f1f3f5;color:#252a30}
body.light-mode .profile-record .record-meta,body.light-mode .pack-status,body.light-mode .profile-note{color:#5b626a}
@media(max-width:670px){.profile-packs{grid-template-columns:1fr}.profile-hero{align-items:flex-start}.profile-avatar{width:50px;height:50px;flex-basis:50px;font-size:21px}.profile-record{align-items:flex-start;flex-direction:column}.profile-record .record-actions{width:100%;justify-content:space-between}}


/* V17: searchable player combobox for Packs */
.pack-autocomplete{position:relative;width:min(100%,365px);flex:1 1 230px;min-width:0}
.pack-autocomplete .filter{width:100%;min-height:40px}
.pack-suggestions{position:absolute;z-index:80;top:calc(100% + 5px);left:0;right:0;max-height:285px;overflow:auto;background:var(--surface);border:1px solid var(--border);box-shadow:0 16px 35px #0005;border-radius:3px;padding:5px}
.pack-suggestion{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:2px;background:transparent;color:var(--text);padding:11px 12px;font-size:13px;cursor:pointer;transition:background .2s ease}
.pack-suggestion:hover,.pack-suggestion[aria-selected=true]{background:var(--surface2);color:var(--accent-strong)}
.pack-suggestion small{font-size:10px;color:var(--muted);white-space:nowrap}
.pack-suggest-empty{color:var(--muted);font-size:12px;padding:11px 12px}
.pack-player-hint{font-size:11px;color:var(--muted);margin-top:8px}
body.light-mode .pack-suggestions{background:#fff;box-shadow:0 15px 30px #151a222b}
body.light-mode .pack-suggestion:hover,body.light-mode .pack-suggestion[aria-selected=true]{background:#e8edf0;color:#313940}
@media(max-width:600px){.pack-filter{align-items:stretch}.pack-autocomplete{flex-basis:100%;width:100%}.pack-suggestions{max-height:235px}}

/* V39: player profile accordion sections; open state is native and accessible. */
.profile-accordion.singlepanel{padding:0;overflow:hidden}
.profile-accordion>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;cursor:pointer;padding:17px 22px;min-height:57px;color:var(--text);transition:background-color .18s ease}
.profile-accordion>summary::-webkit-details-marker{display:none}
.profile-accordion>summary:hover{background:var(--surface2)}
.profile-accordion>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.profile-accordion-heading{font-size:18px;font-weight:800;line-height:1.3}
.profile-accordion-heading small{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;margin-left:5px}
.profile-accordion-chevron{font-size:22px;font-weight:500;line-height:1;color:var(--muted);transition:transform .18s ease;flex:none}
.profile-accordion[open] .profile-accordion-chevron{transform:rotate(180deg)}
.profile-accordion[open]>summary{border-bottom:1px solid var(--border)}
.profile-accordion-content{padding:18px 22px 22px}
.profile-accordion-content>.profile-note:first-child{margin-top:0}
body.light-mode .profile-accordion>summary:hover{background:#f0f2f4}
@media(max-width:670px){.profile-accordion>summary{padding:16px;min-height:55px}.profile-accordion-heading{font-size:16px}.profile-accordion-content{padding:15px 16px 19px}}
@media(prefers-reduced-motion:reduce){.profile-accordion>summary,.profile-accordion-chevron{transition:none}}

/* A near-reference-scale dark treatment of Pointercrate's 2017–2026 Demonlist layout. */

}
*{box-sizing:border-box}

body{background:var(--page);color:var(--text);font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;position:relative}

.container{width:min(1150px,calc(100% - 52px));margin:0 auto}
.sitehead{height:65px;background:#1b1e22;border-bottom:1px solid #41454b;position:relative;z-index:10}
.headinner{display:flex;align-items:center;gap:20px;justify-content:space-between;height:100%}
.wordmark{font-size:19px;line-height:1.1;font-family:'Arial Narrow','Roboto Condensed','Arial',sans-serif;font-weight:900;letter-spacing:-.8px;color:#eee;white-space:nowrap}
.wordmark b{color:#42acde}.wordmark small{display:none}
.navlinks{gap:0;justify-content:flex-end;align-self:stretch;margin-left:auto}

.headsubmit{font-size:11px;letter-spacing:.1px;font-weight:700;color:#d7dee4;padding:7px 11px;border:0;border-left:1px solid #3e444b;white-space:nowrap}
.headsubmit:hover{background:#2d3338}
.pageintro{padding:22px 0 16px}.pageintro h1{font-size:24px}.pageintro p{font-size:12px}

<style>
/* v8 proportional scaling: wider media cards and matching bilateral pixel framing.
   Original pointercrate mobile stacked image hierarchy preserved. */
@media (min-width: 781px) {
  .container { width:min(1210px, calc(100% - 48px)); }
  .layout { grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; }
  .listcards { gap: 24px; }
  .listcard {
    min-height: 214px;
    padding: 19px 21px;
    gap: 27px;
  }
  .thumbnail {
    width: 305px;
    flex: 0 0 305px;
    height: auto;
    aspect-ratio: 16 / 9;
  }
  .listcard h2 { font-size: 25px; line-height: 1.22; }
  .listcard .creator { font-size: 16px; margin-top: 8px; }
  .listcard .tiernote { font-size: 12px; line-height: 1.45; margin-top: 12px; }
  .sidebar { gap: 22px; }
  .panel { padding: 24px 22px; }
  .panel h2 { font-size: 19px; padding-bottom: 14px; margin-bottom: 16px; }
  .panel p { font-size: 13px; line-height: 1.65; }
  .panel .sidebutton { font-size: 12px; padding: 13px 12px; }
  .wide-tabs { height: 56px; margin-bottom: 23px; }
  .wide-tabs button { font-size: 14px; }
  .list-toolbar { margin-bottom: 15px; }
  .list-toolbar .filter { min-height: 41px; width: 260px; font-size: 13px; }
  .singlepanel { padding: 27px 29px; }
  .form-panel, .admin-panel { max-width: 930px; padding: 30px; }
  .videoarea { width: min(100%, 760px); max-width: 760px; }
}
@media (min-width: 781px) and (max-width: 1100px) {
  .container { width: min(100% - 32px, 1080px); }
  .layout { grid-template-columns: minmax(0, 1fr) 252px; gap: 18px; }
  .listcard { min-height: 181px; padding: 16px 17px; gap: 21px; }
  .thumbnail { width: clamp(190px, 27vw, 260px); flex: 0 0 clamp(190px, 27vw, 260px); }
  .listcard h2 { font-size: 22px; }
  .listcard .creator { font-size: 14px; }
  .listcard .tiernote { font-size: 11px; }
  .panel { padding: 20px 17px; }
}
/* The existing v7 pattern is the source; enlarge it rather than drawing a different motif. */
body::before, body::after {
  width: 188px;
  background-size: 185px 1668px;
  background-repeat: repeat-y;
  opacity: .92;
  -webkit-mask-image: linear-gradient(to right,#000 0%,#000 48%,transparent 100%);
  mask-image: linear-gradient(to right,#000 0%,#000 48%,transparent 100%);
}
body::before { left: 0; right: auto; transform: none; }
body::after { right: 0; left: auto; transform: scaleX(-1); }
@media (max-width: 780px) {
  body::before, body::after {
    display: block;
    width: 64px;
    background-size: 125px 1127px;
    opacity: .43;
  }
  .listcards { gap: 27px; padding-inline: 13px; }
  .listcard { padding: 20px 20px 27px; }
  .thumbnail { width:100%; flex:none; height:auto; aspect-ratio:16 / 9; }
  .listcard h2 { font-size: 25px; }
  .listcard .creator { font-size: 17px; margin-top: 8px; }
  .listcard .tiernote { font-size: 13px; margin-top: 8px; }
  .singlepanel { padding: 20px; }
  .videoarea { max-width: 100%; }
}
@media (max-width: 540px) {
  body::before, body::after {
    width: 34px;
    background-size: 94px 848px;
    opacity: .40;
  }
  .listcards { gap: 25px; padding-inline: 9px; }
  .listcard { padding: 15px 13px 25px; }
  .listcard h2 { font-size: 23px; }
  .listcard .creator { font-size: 16px; }
  .listcard .tiernote { font-size: 12px; }
  /* Don't allow the scaled cards to push the permanent portrait search off screen. */
  .mobile-search { max-width: calc(100% - 32px); }
}
@media (max-width: 360px) {
  .listcards { padding-inline: 6px; }
  .listcard { padding-inline: 10px; }
  .listcard h2 { font-size: 21px; }
}

</style>

<style id="v9-appearance-controls">
/* User-controllable appearance. Defaults are deliberately neutral grey. */
:root{--accent:#d0d3d8;--accent-strong:#828992;--accent-button:#666d76;--accent-button-hover:#7b838d;--accent-rgb:208,211,216;--pixel-filter:none;color-scheme:dark}
body::before,body::after{filter:none}
.wordmark b,.backbutton,.textbutton,.panel a,.foot a,.pack button,.progressrow button,.fact button{color:var(--accent)}
.navlinks button.active:after,.wide-tabs button[aria-selected=true]::after{background:var(--accent)}
.listcard:hover,.listcard:focus-visible,.tierchip:hover{border-color:var(--accent)}
.mobile-search::before{color:var(--accent)}
.mobile-search .filter:focus{border-color:var(--accent);outline-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.panel .sidebutton,.actionbutton{background:var(--accent-button);border-color:var(--accent-button);color:white}
.panel .sidebutton:hover,.actionbutton:hover{background:var(--accent-button-hover)}
.recordtable th{color:var(--accent)}
.progressrow input{accent-color:var(--accent-strong)}
.headsubmit{border-color:var(--accent-strong);color:var(--text)}
/* Desktop and mobile site appearance controls. */
.sitehead{position:relative;z-index:30}
.headinner{position:relative}
.appearance-tools{display:flex;align-items:center;gap:5px;flex:0 0 auto;align-self:stretch}
.appearance-button{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;width:40px;min-width:40px;min-height:40px;border:0;background:transparent;color:var(--text);padding:5px;border-radius:3px;position:relative}
.appearance-button:hover,.appearance-button[aria-expanded="true"]{background:var(--surface2)}
.appearance-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.appearance-button .swatch-dot{width:19px;height:19px;border-radius:50%;background:var(--accent-strong);border:2px solid #ffffff94;box-shadow:0 0 0 1px #0005}
.appearance-popover{position:absolute;z-index:100;top:calc(100% + 10px);right:0;width:304px;padding:18px;border:1px solid var(--border);background:var(--surface);color:var(--text);box-shadow:0 18px 45px #0008;border-radius:5px}
/* Popover visibility handled by animated is-open class. */
.appearance-popover::before{content:"";position:absolute;top:-7px;right:52px;width:12px;height:12px;transform:rotate(45deg);background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border)}
.appearance-title{font-weight:850;font-size:16px;margin-bottom:3px}
.appearance-help{font-size:11px;line-height:1.45;color:var(--muted);margin-bottom:14px}
.hue-wheel{width:148px;height:148px;position:relative;margin:0 auto 14px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);box-shadow:0 0 0 3px var(--surface2),0 0 0 4px var(--border);cursor:crosshair;touch-action:none;user-select:none}
.hue-wheel::before{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px #0003}
.hue-wheel .wheel-center{position:absolute;inset:40px;border-radius:50%;background:var(--accent-strong);border:4px solid var(--surface);pointer-events:none;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:11px;font-weight:850;text-shadow:0 1px 3px #000a}
.hue-wheel .wheel-knob{position:absolute;top:0;left:50%;width:18px;height:18px;border:3px solid white;border-radius:50%;background:#3d444b;box-shadow:0 0 0 2px #0009;transform:translate(-50%,-50%);pointer-events:none}
.appearance-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.appearance-row label{font-size:12px;font-weight:750;color:var(--text)}
.appearance-row output{color:var(--muted);font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace}
.appearance-native{display:flex;align-items:center;gap:8px}
.appearance-native input[type=color]{width:41px;height:31px;padding:2px;border:1px solid var(--border);background:var(--surface2);border-radius:3px;cursor:pointer}
.appearance-reset{display:block;width:100%;margin-top:15px;background:var(--surface2);color:var(--text);padding:9px;border:1px solid var(--border);font-weight:750;font-size:12px}
.appearance-reset:hover{border-color:var(--accent)}
/* Offline/blocked video previews use a neutral fallback rather than the old blue stripes. */
.thumbnail{background:linear-gradient(140deg,var(--thumb-a,#343a40),var(--thumb-b,#1c2228) 48%,var(--thumb-c,#4a5158))}
.thumbnail::before{background:linear-gradient(158deg,transparent 10%,var(--thumb-lines,#c1c7cd16) 10% 13%,transparent 14% 35%,var(--thumb-lines,#c1c7cd16) 35% 38%,transparent 39%),repeating-linear-gradient(0deg,var(--thumb-lines,#c1c7cd16) 0 3px,transparent 3px 24px)}
/* A properly readable light theme, not just white cards on dark controls. */
body.light-mode{--page:#f5f6f7;--surface:#fff;--surface2:#eceef0;--top:#fff;--border:#d5d8db;--muted:#59636e;--dim:#67717a;--text:#24272b;--accent:#555c64;--accent-strong:#727880;--accent-button:#727880;--accent-button-hover:#555d64;color-scheme:light;color:var(--text)}

<style id="layout-list-v24-dropdown-motion">
/* Shared, non-fading reveal. Panel and text never translate or scale. */
:root{--ll-dropdown-duration:260ms;--ll-dropdown-easing:cubic-bezier(.22,.7,.22,1)}

/* Height follows the menu's actual contents, with no oversized max-height guess. */
.mobile-menu{
  display:grid;grid-template-rows:0fr;overflow:hidden;
  padding:0 15px;max-height:none;opacity:1;transform:none;
  visibility:hidden;pointer-events:none;will-change:auto;
  transition:grid-template-rows var(--ll-dropdown-duration) var(--ll-dropdown-easing),
    visibility 0s linear var(--ll-dropdown-duration);
}
.mobile-menu.open{
  display:grid;grid-template-rows:1fr;max-height:none;
  padding:0 15px;opacity:1;transform:none;
  visibility:visible;pointer-events:auto;
  transition:grid-template-rows var(--ll-dropdown-duration) var(--ll-dropdown-easing),visibility 0s;
}
.mobile-menu-inner{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0}
.mobile-menu-inner > :first-child{margin-top:10px}
.mobile-menu-inner > :last-child{margin-bottom:13px}

/* Reveal downward using a clip, without animating text or opacity. */
.difficulty-popover,.appearance-popover,.language-menu{
  opacity:1;transform:none;transform-origin:initial;
  clip-path:inset(0 0 100% 0);visibility:hidden;pointer-events:none;will-change:auto;
  transition:clip-path var(--ll-dropdown-duration) var(--ll-dropdown-easing),
    visibility 0s linear var(--ll-dropdown-duration);
}
.difficulty-popover.is-open,.appearance-popover.is-open,.language-menu.open{
  opacity:1;transform:none;clip-path:inset(0 0 0 0);
  visibility:visible;pointer-events:auto;
  transition:clip-path var(--ll-dropdown-duration) var(--ll-dropdown-easing),visibility 0s;
}
/* None of these controls rely on fading in to convey state. */
@media (prefers-reduced-motion:reduce){
  .mobile-menu,.difficulty-popover,.appearance-popover,.language-menu{
    transition:none!important;
  }
}
</style>

<style id="v28-fixed-mobile-pixel-repaint-fix">
/* Preserve V26's viewport-fixed, mirrored pixel artwork.
   Mobile Chromium can clip negative-z-index fixed pseudo-elements when
   browser chrome changes the visual viewport during scrolling. */
@media (max-width: 780px) {
  body { isolation: isolate; }
  #app { position: relative; z-index: 1; }
  body::before,
  body::after {
    position: fixed !important;
    top: 0 !important;
    bottom: auto !important;
    height: calc(100vh + 1px);
    z-index: 0 !important;
  }
  @supports (height: 100lvh) {
    body::before,
    body::after { height: calc(100lvh + 1px); }
  }
}
</style>

function hexToHsv(hex){const [r,g,b]=rgbFromHex(hex).map(n=>n/255),max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d>0){if(max===r)h=(60*((g-b)/d)+360)%360;else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);}return {h,s:max===0?0:d/max,v:max};}

function rgbFromHex(hex){let h=hex.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function hueFromHex(hex){const [r,g,b]=rgbFromHex(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),delta=mx-mn;let hue=0;if(delta){if(mx===r)hue=((g-b)/delta)%6;else if(mx===g)hue=(b-r)/delta+2;else hue=(r-g)/delta+4;}return ((hue*60)+360)%360;}
function toHexFromHue(hue){const h=((hue%360)+360)%360/60,c=1,x=c*(1-Math.abs(h%2-1));const seg=h<1?[c,x,0]:h<2?[x,c,0]:h<3?[0,c,x]:h<4?[0,x,c]:h<5?[x,0,c]:[c,0,x];return '#'+seg.map(v=>Math.round((v*.72+.28)*255).toString(16).padStart(2,'0')).join('');}
function pixelSource(){if(pixelSourceSvg!==null)return pixelSourceSvg;const val=getComputedStyle(document.documentElement).getPropertyValue('--laylist-pixel-pattern');const match=val.match(/base64,([\w+/=]+)/);pixelSourceSvg=match?atob(match[1]):'';return pixelSourceSvg;}

function appearanceActions(){const themeLabel=S.light?'Switch to dark mode':'Switch to light mode';return `<div class="appearance-tools"><button type="button" class="appearance-button" data-open-palette aria-expanded="${S.paletteOpen}" aria-controls="appearance-popover" aria-label="Choose accent color" title="Customize color"><span class="swatch-dot" aria-hidden="true"></span></button><button type="button" class="appearance-button" data-theme-toggle="true" aria-label="${themeLabel}" title="${themeLabel}">${S.light?THEME_SUN:THEME_MOON}</button></div>`;}
function applyAppearance(){
 document.body.classList.toggle('light-mode',S.light);
 const root=document.documentElement;
 const color=S.appearanceColor;
 const source=color||THEME_DEFAULT_GREY;
 const {h,s,v}=hexToHsv(source);
 let ink,btn,hover,ink2;
 if(!color){ink=S.light?'#565e66':'#d0d3d8';ink2=S.light?'#60666d':'#a0a6ae';btn=S.light?'#707780':'#626970';hover=S.light?'#87919a':'#79818a'}
 else{
  const vivid=Math.round(28+s*57);
  ink=`hsl(${h.toFixed(1)},${vivid}%,${S.light?'33':'74'}%)`;
  ink2=`hsl(${h.toFixed(1)},${Math.round(15+s*62)}%,${S.light?'39':'63'}%)`;
  btn=`hsl(${h.toFixed(1)},${Math.round(17+s*55)}%,${S.light?'35':'42'}%)`;
  hover=`hsl(${h.toFixed(1)},${Math.round(12+s*46)}%,${S.light?'41':'51'}%)`;
 }
 for(const el of [root,document.body]){el.style.setProperty('--accent',ink);el.style.setProperty('--accent-strong',ink2);el.style.setProperty('--accent-button',btn);el.style.setProperty('--accent-button-hover',hover);}
 const thumbs=color?{a:`hsl(${h.toFixed(1)},${Math.round(s*48)}%,21%)`,b:`hsl(${h.toFixed(1)},${Math.round(s*50)}%,13%)`,c:`hsl(${h.toFixed(1)},${Math.round(s*48)}%,30%)`,lines:`hsla(${h.toFixed(1)},${Math.round(s*65)}%,75%,.11)`}:{a:'#343a40',b:'#1c2228',c:'#4a5158',lines:'#b9c0c51a'};
 for(const [key,val] of Object.entries(thumbs))root.style.setProperty('--thumb-'+key,val);
 const src=pixelSource();if(src){
  if(!color){root.style.removeProperty('--laylist-pixel-pattern')}
  else{
   const base=rgbFromHex(color);
   const recolored=src.replace(/fill="#([\da-fA-F]{6})"/g,(_,hex)=>{
    // The original #4e4e4e tile is the exact chosen RGB; neighboring tiles retain their shading.
    const shade=rgbFromHex('#'+hex)[0]/78;
    const rgb=base.map(channel=>Math.max(0,Math.min(255,Math.round(channel*shade))));
    return 'fill="#'+rgb.map(n=>n.toString(16).padStart(2,'0')).join('')+'"';
   });root.style.setProperty('--laylist-pixel-pattern','url("data:image/svg+xml;base64,'+btoa(recolored)+'")');
  }
 }
 syncColorPicker();
 const themeMeta=document.querySelector('meta[name="theme-color"]');if(themeMeta)themeMeta.content=S.light?'#ffffff':'#171a1d';
}
function syncColorPicker(){
 const square=document.getElementById('color-square');if(square){square.style.setProperty('--picker-x',S.pickerH/3.6+'%');square.style.setProperty('--picker-y',(1-S.pickerV)*100+'%');square.style.setProperty('--picker-desat',String(1-S.pickerS));square.setAttribute('aria-valuenow',String(Math.round(S.pickerV*100)));square.setAttribute('aria-valuetext',`Hue ${Math.round(S.pickerH)} degrees, brightness ${Math.round(S.pickerV*100)} percent`)}
 const sat=document.getElementById('color-saturation');if(sat){sat.style.setProperty('--picker-hue',`hsl(${S.pickerH},100%,50%)`);sat.value=String(Math.round(S.pickerS*100));}
 const code=document.getElementById('accent-code');if(code)code.textContent=(S.appearanceColor||THEME_DEFAULT_GREY).toUpperCase();
 const swatch=document.querySelector('.color-preview-swatch');if(swatch)swatch.style.background=S.appearanceColor||THEME_DEFAULT_GREY;
 const label=document.querySelector('.color-preview-label');if(label)label.textContent=S.appearanceColor?'Custom accent':'Default neutral grey';
 const [r,g,b]=rgbFromHex(S.appearanceColor||THEME_DEFAULT_GREY);
 const data={'color-r':r,'color-g':g,'color-b':b,'color-h':Math.round(S.pickerH),'color-s':Math.round(S.pickerS*100),'color-v':Math.round(S.pickerV*100),'color-hex':(S.appearanceColor||THEME_DEFAULT_GREY).toUpperCase()};
 for(const [id,value] of Object.entries(data)){let el=document.getElementById(id);if(el&&document.activeElement!==el)el.value=value;}
}
function saveAppearanceColor(c,keepHSV=false){
 if(c&&!/^#[\da-fA-F]{6}$/.test(c))return;
 S.appearanceColor=c;
 if(c&&!keepHSV)updatePickerHSVFromHex(c);
 if(!c){updatePickerHSVFromHex(THEME_DEFAULT_GREY);}
 saveJson(APPEARANCE_KEY,{color:c});applyAppearance();
}
function setSquareColor(event){const el=document.getElementById('color-square');if(!el)return;const r=el.getBoundingClientRect();S.pickerH=Math.min(359.999,Math.max(0,(event.clientX-r.left)/r.width*360));S.pickerV=1-Math.min(1,Math.max(0,(event.clientY-r.top)/r.height));saveAppearanceColor(hsvToHex(S.pickerH,S.pickerS,S.pickerV),true);}
function setColorField(id,value){
 const num=Number(value);if(!Number.isFinite(num))return;
 if(id==='color-h')S.pickerH=Math.max(0,Math.min(359,num));
 if(id==='color-s')S.pickerS=Math.max(0,Math.min(100,num))/100;
 if(id==='color-v')S.pickerV=Math.max(0,Math.min(100,num))/100;
 saveAppearanceColor(hsvToHex(S.pickerH,S.pickerS,S.pickerV),true);
}
function syncDropdownScrim(){
 const scrim=document.getElementById('dropdown-scrim');
 const active=Boolean(S.menuOpen||S.difficultyOpen||S.paletteOpen||S.languageOpen);
 if(scrim)scrim.classList.toggle('is-visible',active);
 document.querySelector('.tier-wrap')?.classList.toggle('dropdown-active',Boolean(S.difficultyOpen));
}
function closeDropdowns(){
 if(S.languageOpen)setLanguageOpen(false);
 if(S.difficultyOpen)toggleDifficultyMenu(false);
 if(S.paletteOpen)togglePaletteMenu(false);
 if(S.menuOpen){S.menuOpen=false;syncMenu();}
 syncDropdownScrim();
}
function toggleDifficultyMenu(force){
 const opening=typeof force==='boolean'?force:!S.difficultyOpen;
 if(opening){
  if(S.paletteOpen)togglePaletteMenu(false);
  if(S.languageOpen)setLanguageOpen(false);
  if(S.menuOpen){S.menuOpen=false;syncMenu();}
 }
 S.difficultyOpen=opening;
 const p=document.getElementById('difficulty-popover'),b=document.querySelector('[data-toggle-difficulties]');
 if(!opening&&p?.contains(document.activeElement))b?.focus();
 if(p){p.classList.toggle('is-open',opening);p.inert=!opening;p.setAttribute('aria-hidden',String(!opening));}
 if(b)b.setAttribute('aria-expanded',String(opening));
 if(opening && window.matchMedia('(hover: hover) and (pointer: fine)').matches) document.getElementById('difficulty-search')?.focus();
 syncDropdownScrim();
}
function togglePaletteMenu(force, restoreFocus=true){
 const opening=typeof force==='boolean'?force:!S.paletteOpen;
 if(opening){
  if(S.difficultyOpen)toggleDifficultyMenu(false);
  if(S.languageOpen)setLanguageOpen(false);
  if(S.menuOpen){S.menuOpen=false;syncMenu();}
 }
 S.paletteOpen=opening;
 const p=document.getElementById('appearance-popover'),b=document.querySelector('[data-open-palette]');
 if(!opening&&restoreFocus&&p?.contains(document.activeElement))b?.focus();
 if(p){p.classList.toggle('is-open',opening);p.inert=!opening;p.setAttribute('aria-hidden',String(!opening));}
 if(b)b.setAttribute('aria-expanded',String(opening));
 syncDropdownScrim();
}

 // Only matching UI copy is translated. Never translate underlying records, names, IDs or proof URLs.
 const skip='script,style,code,pre,.listcard h2,[data-player-profile],.playername,.clan-badge,.thumbnail,.recordtable td,[data-level],.clan-members,.grind-row h3,.reviewcard h3';
 const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT,{acceptNode(node){const parent=node.parentElement;if(!parent||parent.closest(skip)||parent.closest('.language-picker'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
 let node;while(node=walker.nextNode()){
  const raw=node.nodeValue;const parent=node.parentElement;const trimmed=raw.trim();if(!trimmed)continue;
  let translated=terms[trimmed];
  if(!translated && parent.classList.contains('tiernote')){
    let x=trimmed;
    for(const tier of TIER){const name=tier+' Layout';if(terms[name])x=x.replace(name,terms[name]);}
    if(terms['minimum record'])x=x.replace('minimum record',terms['minimum record']);
    if(terms['points (100%)'])x=x.replace('points (100%)',terms['points (100%)']);
    translated=x!==trimmed?x:undefined;
  }
  if(!translated){const upper=trimmed.match(/^([A-Z][A-Z ]+) ↗$/);if(upper){const key=upper[1].split(' ').map(s=>s.charAt(0)+s.slice(1).toLowerCase()).join(' ');translated=terms[key]?terms[key]+' ↗':undefined}}
  if(translated)node.nodeValue=raw.replace(trimmed,translated);
 }
 app.querySelectorAll('input,textarea,button,a,select,div').forEach(el=>{
  if(el.closest('.language-picker'))return;
  for(const attr of LANGUAGE_ATTRS){const value=el.getAttribute(attr);if(value&&terms[value])el.setAttribute(attr,terms[value]);}
 });
}

function header(){const nav=[['list','List'],['stats','Stats Viewer'],['grind','Grind'],['roulette','Roulette'],['packs','Packs'],['submit','Submit Record'],['admin','Admin']];return `<header class="sitehead"><div class="container headinner"><a class="wordmark" href="#/list" data-page="list" aria-label="The Layout List home">LAYOUT<b> LIST</b></a><nav class="navlinks" aria-label="Main navigation">${nav.map(([key,label])=>`<button type="button" data-page="${key}" class="${(S.page==='detail'?'list':S.page)===key?'active':''}">${label}</button>`).join('')}</nav><button type="button" class="headsubmit" data-page="submit">SUBMIT A RECORD ↗</button>${languageButton()}${appearanceActions()}${appearancePicker()}<div class="mobilehead-tools"><button type="button" class="mobileicon ${S.menuOpen?'is-open':''}" data-menu-toggle="true" aria-label="${S.menuOpen?'Close':'Open'} navigation" aria-expanded="${S.menuOpen}" aria-controls="site-menu"><span class="menu-bars" aria-hidden="true"><i></i><i></i><i></i></span></button></div></div><div id="site-menu" class="mobile-menu ${S.menuOpen?'open':''}" role="navigation" aria-label="Mobile navigation" aria-hidden="${!S.menuOpen}" ${S.menuOpen?'':'inert'}><div class="mobile-menu-inner">${nav.map(([key,label])=>`<button data-page="${key}">${label}</button>`).join('')}<button data-search-toggle="true">Search layouts</button></div></div></header>`}
function intro(){let title={list:'The Layout List',detail:'The Layout List',profile:'Player Profile',stats:'Stats Viewer',packs:'Level Packs',roulette:'Layout Roulette',grind:'Grind by Player',clan:'Clan Roster'}[S.page];let desc={list:'The ranked list of Geometry Dash layouts, using Layout List data in a familiar Pointercrate-style interface.',detail:'Browse verification footage, level information, and accepted records.',profile:'Accepted records, completed packs, and layout contributions for individual players.',stats:'Community records and completions calculated from published Layout List entries.',packs:'The official Layout List collections and challenges.',roulette:'A percentage-based challenge across real Layout List levels.',grind:'Select a player to see which ranked layouts they have not completed.',clan:'Member profiles, completion records, and clan affiliation.'}[S.page];return `<section class="pageintro container"><h1>${title}</h1><p>${desc}</p></section>`}
function sidebar(){let max=S.levels.length;let accepted=S.levels.reduce((n,l)=>n+(l.records?.length||0),0);let completions=S.levels.reduce((n,l)=>n+(l.records?.filter(r=>Number(r.percent)===100).length||0),0);return `<aside class="sidebar"><section class="panel"><h2>List Editors</h2><p>For placement questions and record issues, contact the Layout List team through the official site.</p><div class="team-list"><a href="https://laylist.pages.dev/#/" target="_blank" rel="noopener noreferrer">Official Layout List</a><a href="${SOURCE}" target="_blank" rel="noopener noreferrer">Official data repository</a></div><p class="side-note">Rankings and level records come from the Layout List, not Pointercrate.</p></section><section class="panel"><h2>Record Submissions</h2><p>Completed a layout or made progress? Submit proof directly on this site. An admin will review it before it appears in site-approved records.</p><button type="button" class="sidebutton" data-page="submit">SUBMIT A RECORD ↗</button></section><section class="panel"><h2>List Statistics</h2><div class="bulletrows"><div><span>Ranked layouts</span><strong>${fmt(max)}</strong></div><div><span>Accepted records loaded</span><strong>${fmt(accepted)}</strong></div><div><span>100% completions loaded</span><strong>${fmt(completions)}</strong></div></div></section><section class="panel"><h2>Guidelines</h2><p>Visit the official site for current rules and record-submission information. This is an unofficial visual redesign.</p><a href="https://laylist.pages.dev/#/" target="_blank" rel="noopener noreferrer">View the official site ↗</a></section><section class="panel"><h2>Difficulty Tiers</h2><p>Filter the ranking by Layout List difficulty.</p><div class="tierlinks">${TIER.map((name,i)=>`<button class="tierchip" type="button" data-quicktier="${i}">${esc(name)}</button>`).reverse().join('')}</div></section></aside>`}
function shell(main){return `<div class="container layout"><main class="content">${main}</main>${sidebar()}</div>`}
function status(){return `<div class="smallstatus">${S.online?'<span class="online">● Connected to Layout List data</span>':S.loading?'● Connecting to Layout List data':'● Offline examples: live data could not be reached'} · ${fmt(S.levels.filter(l=>!l.pending&&!l.failed).length)} / ${fmt(S.levels.length)} level details available${S.loading?' · loading in the background':''}</div>`}
function isFormerTopOneSelection(level){return Number(level?.rank)===1||isFormerTopOne(level)}
function getVisible(){let a=S.levels.filter(l=>{if(S.difficulty==='former-top-1s'){if(!isFormerTopOneSelection(l))return false}else if(S.difficulty!=='all'&&String(l.difficulty)!==S.difficulty)return false;let text=[l.name,l.id,l.rank,...(l.creators||[]),l.verifier,l.path].join(' ').toLowerCase();return !S.search||text.includes(S.search.toLowerCase())});return a.sort((a,b)=>a.rank-b.rank)}

// YouTube fallback: custom images take precedence. Expire stale metadata after 30 days.
const YOUTUBE_AVATARS=JSON.parse(document.getElementById('youtube-avatar-data').textContent).players||{};
function youtubeAvatarUrl(key){const row=YOUTUBE_AVATARS[key];if(!row||Date.now()-Date.parse(row.checkedAt)>30*86400000||!Number.isFinite(Date.parse(row.checkedAt)))return '';return /^(https:\/\/|data:image\/(?:png|jpeg|webp);base64,)/.test(row.imageUrl||'')?row.imageUrl:''}

document.addEventListener('error',event=>{const img=event.target;if(img?.tagName!=='IMG')return;if(!Object.values(YOUTUBE_AVATARS).some(row=>row.imageUrl===img.getAttribute('src')))return;const holder=img.closest('.member-avatar,.profile-avatar');if(holder)holder.textContent=(img.alt||'').replace(/ profile picture$/,'').slice(0,2).toUpperCase();else img.remove()},true);
function playerPfpUrl(name){const key=String(name||'').trim().toLocaleLowerCase('en');return EXTRA_PLAYER_PFP_IMAGES[key]||PLAYER_PFP_IMAGES[key]||youtubeAvatarUrl(key)}
function playerPfp(name,context='profile'){
 const src=playerPfpUrl(name),initials=esc(String(name||'').trim().slice(0,2).toUpperCase());
 const css=context==='roster'?'member-avatar':'profile-avatar';
 return `<span class="${css}" ${src?'':'aria-hidden="true"'}>${src?`<img src="${esc(src)}" alt="${esc(name)} profile picture">`:initials}</span>`;
}
function clanOf(name){return S.clans.find(c=>(c.members||[]).some(m=>String(m).toLowerCase()===String(name||'').toLowerCase()))}
function clanAvatar(clan){return String(clan?.tag||'').toUpperCase()==='LLOG'?LL_CLAN_AVATAR:(clan?.avatar||'')}
function clanBadge(clan){return clan?`<button type="button" class="clan-badge" data-clan="${esc(clan.tag)}" title="View ${esc(clan.name||clan.tag)} clan members">[${esc(clan.tag)}]</button> `:''}
function playerButton(name,extra=''){return clanBadge(clanOf(name))+`<button type="button" class="player-link ${extra}" data-player-profile="${esc(name)}" aria-label="View ${esc(name)}'s player profile">${esc(name)}</button>`}
function clanPointSummary(clan,players){
 // Add each member's account completions, not a set union of level IDs.
 // Duplicate or case-variant roster entries represent the same player once.
 const byName=new Map(players.map(p=>[p.name.trim().toLocaleLowerCase('en'),p]));
 const unique=[...new Map((clan.members||[]).map(name=>[String(name).trim().toLocaleLowerCase('en'),String(name).trim()]).filter(([key])=>key)).values()];
 const members=unique.map(name=>({name,player:byName.get(name.toLocaleLowerCase('en'))||null}));
 const sum=key=>roundPoint(members.reduce((total,m)=>total+(m.player?.[key]||0),0));
 const recordPoints=sum('recordPoints');
 const verificationPoints=sum('verificationPoints');
 const packPoints=sum('packPoints');
 const completions=members.reduce((total,m)=>total+(m.player?.completions||0),0);
 return {members,recordPoints,verificationPoints,packPoints,completions,totalPoints:roundPoint(recordPoints+verificationPoints+packPoints),scoredMembers:members.filter(m=>m.player).length};
}
function clanPage(){
 const clan=S.clans.find(c=>c.tag.toLowerCase()===String(S.clanTag).toLowerCase());
 if(!clan)return shell('<section class="singlepanel"><h2>Clan not found</h2></section>');
 const summary=clanPointSummary(clan,playerStats());
 const verified=completeCatalog();
 const scoreNote=verified?'Based on the published accepted records, verification credit, and earned pack bonuses.':'Preview only. Live Layout List data is incomplete, so the final clan total may change.';
 const avatar=clanAvatar(clan);
 return shell(`<div class="backrow"><button class="backbutton" type="button" data-back-leaderboard="clans">‹ Clan leaderboard</button></div><section class="singlepanel clan-card"><div class="clan-hero">${avatar?`<div class="clan-avatar-wrap"><img class="clan-avatar" src="${esc(avatar)}" alt="${esc(clan.name)} clan profile picture"></div>`:`<div class="clan-mark">[${esc(clan.tag)}]</div>`}<div><div class="clan-title-row"><h1>${esc(clan.name)}</h1><span class="clan-tag-pill">[${esc(clan.tag)}]</span></div><p class="profile-note">${summary.members.length} members</p></div></div><div class="clan-points"><div class="clan-points-total"><strong>${pointLabel(summary.totalPoints)}</strong><span>Total clan points${verified?'':' (preview)'}</span></div><div class="clan-points-breakdown"><div><strong>${pointLabel(summary.recordPoints)}</strong><span>Record points</span></div><div><strong>${pointLabel(summary.verificationPoints)}</strong><span>Verification points</span></div><div><strong>${pointLabel(summary.packPoints)}</strong><span>Earned pack bonuses</span></div><div><strong>${fmt(summary.completions)}</strong><span>Member completions</span></div></div></div><p class="clan-score-note">${scoreNote}</p></section><section class="singlepanel"><h2>Clan roster</h2><div class="clan-roster">${summary.members.map(({name,player})=>`<div class="clan-person"><div class="member-main">${playerPfp(name,'roster')}<div>${playerButton(name)}<p class="profile-note">${player?`${fmt(player.completions)} completed layouts · ${pointLabel(player.totalPoints)} points`:'No accepted records currently loaded'}</p></div></div><button class="ghostbutton" data-player-profile="${esc(name)}">View profile ↗</button></div>`).join('')}</div></section>`);
}

function playerRecordNames(level){return new Map((level.records||[]).filter(r=>r.user).map(r=>[String(r.user).trim().toLocaleLowerCase('en'),r]));}
// Historical placements are manually annotated; official live level data supplies current ranks.
const FORMER_TOP_ONE=new Set(['lightitup','brutalcalamity','huangquan','karma','sailingforce','chillychappers','ai','experiment','fallenskies','achelous','incision']);
function isFormerTopOne(level){
 const normalize=value=>String(value||'').toLocaleLowerCase('en').replace(/\(\s*2p\s*\)/gi,'').replace(/[^a-z0-9]/g,'');
 return FORMER_TOP_ONE.has(normalize(level?.name))||FORMER_TOP_ONE.has(normalize(level?.path));
}
function formerTopOneBadge(level){return isFormerTopOne(level)?'<span class="former-top-one-badge" title="Former Top 1 ranked level">Former Top 1</span>':''}
function isTwoPlayerLevel(level){
 // Use the exact (2p) notation, ignoring capitalization and optional whitespace.
 // Check a pending level's path only when its official name has not loaded yet.
 const title=String(level?.name||'');
 if(/\(\s*2p\s*\)/i.test(title))return true;
 if(level?.pending || !title)return /(?:^|[_-])2p(?:[_-]|$)/i.test(String(level?.path||''));
 return false;
}
function twoPlayerBadge(level){return isTwoPlayerLevel(level)?'<span class="former-top-one-badge two-player-badge" title="Two-player layout">2-Player</span>':''}
function levelBadges(level){return formerTopOneBadge(level)+twoPlayerBadge(level)}
function listcard(l){
 const by=(l.creators||[]).slice(0,3);
 const range=l.percentToQualify!=null?`${l.percentToQualify}% minimum record`:null;
 const proof=safeMediaUrl(l.verification);
 const thumbnail=proof
 ?`<a class="thumbnail" href="${esc(proof)}" target="_blank" rel="noopener noreferrer" aria-label="Watch verification video for ${esc(l.name)}" title="Open verification video">${img(l)}<span class="thumb-watermark" aria-hidden="true">LL</span></a>`
 :`<button type="button" class="thumbnail" data-level="${esc(l.path)}" aria-label="View level details for ${esc(l.name)}">${img(l)}<span class="thumb-watermark" aria-hidden="true">LL</span></button>`;
 return `<article class="listcard">${thumbnail}<div class="listcardmeta"><div class="level-card-title-row"><button type="button" class="textbutton" style="text-align:left;display:block;color:inherit" data-level="${esc(l.path)}" aria-label="View level details for ${esc(l.name)}"><h2><span class="hash">#${fmt(l.rank)} – </span>${esc(l.name||displaySlug(l.path))}</h2></button>${levelBadges(l)}</div><div class="creator">published by ${by.length?by.map(c=>playerButton(c,'inline-player')).join(', '):'<strong>Creator loading…</strong>'}</div><div class="tiernote">${esc(tier(l))} Layout${l.id?' · ID '+esc(l.id):''}${range?' · '+esc(range):''} · ${pointLabel(levelPoints(l))} points (100%)</div></div></article>`
}
function listPage(){
 const items=getVisible();
 const groups=TIER.map((name,i)=>({key:String(i),label:name+' Layouts',count:S.levels.filter(l=>String(l.difficulty)===String(i)).length})).reverse();
 groups.push({key:'former-top-1s',label:'Former Top 1s',count:S.levels.filter(isFormerTopOneSelection).length});

// Identity is a normalized player name, not an account claim or authenticated GD profile.
// V16 points: Layout List js/config.js score() curve with Beginner minimum
// changed from 3 to 1 at the user's request. Percent qualification and 0.1
// precision match the published source. Sparse offline preview uses tier order.
const SCORE_LINEAR_BOUNDS=[[1,7],[7.1,13],[13.1,37],[37.1,63],[63.1,87],[87.1,130]];

function roundPoint(n){return Math.round((Number(n)+Number.EPSILON)*10)/10}

function levelPoints(level,percent=100,levels=S.levels){
 const d=Number(level?.difficulty),rank=Number(level?.rank);
 if(!Number.isInteger(d)||d<0||d>=TIER.length||!Number.isFinite(rank)||rank<1)return 0;
 let base=0;
 if(d<6){
  const peers=levels.filter(l=>Number(l.difficulty)===d&&Number.isFinite(Number(l.rank))&&!l.failed).sort((a,b)=>a.rank-b.rank);
  const pos=peers.findIndex(l=>l.path===level.path);
  if(pos<0||!peers.length)return 0;
  const [minimum,maximum]=SCORE_LINEAR_BOUNDS[d];
  base=peers.length===1?(d===0?minimum:maximum):maximum-(maximum-minimum)*pos/(peers.length-1);
 }else{
  // Official exponential anchor: last ranked level in Extreme (difficulty 6).
  const extremeRanks=levels.filter(l=>Number(l.difficulty)===6&&!l.failed).map(l=>Number(l.rank)).filter(Number.isFinite);
  const anchor=extremeRanks.length?Math.max(...extremeRanks):Math.max(rank,2);
  const x=Math.min(1,Math.max(0,(rank-1)/Math.max(1,anchor-1)));
  base=Math.max(131,Math.min(750,750*Math.exp(Math.log(131/750)*Math.pow(x,0.4))));
 }
 let minPercent=d<4?100:Number(level.percentToQualify);
 if(!Number.isFinite(minPercent)||minPercent<1||minPercent>100)minPercent=100;
 const pct=Math.max(0,Math.min(100,Number(percent)||0));
 // Matches Layout List: qualifying minimum earns a small fraction, 100% earns the full value.
 const weighted=base*((pct-(minPercent-1))/(100-(minPercent-1)));
 return roundPoint(Math.max(0,weighted));
}

function calculatePlayerPoints(player,eligiblePacks=[]){

 // Verification takes precedence as the source, never as a second award.

  const key=item.level.path,pct=Number(item.record.percent);
  if(Number.isFinite(pct))byPath.set(key,Math.max(byPath.get(key)||0,pct));

 for(const path of verifiedPaths)byPath.set(path,100);

 for(const [path,pct] of byPath){

  if(!level||level.pending||level.failed)continue;
  const points=levelPoints(level,pct);
  if(points>0)detail.push({path,level,percent:pct,points,source:verifiedPaths.has(path)?'verification':'record'});

function playerStats(){

// Layout List Roulette: rules independently implemented from official public source.
const ROULETTE_KEY='layout-list-roulette-v14';
function restoreRouletteSession(){
 const r=loadJson('layout-list-roulette-v14',null);
 if(!r || !Array.isArray(r.levels) || !Array.isArray(r.progression)) return {levels:[],progression:[],givenUp:false,showRemaining:false,useMainList:true,useExtendedList:true};
 return sanitizeRoulette(r)||{levels:[],progression:[],givenUp:false,showRemaining:false,useMainList:true,useExtendedList:true};
}
function sanitizeRoulette(raw){
 if(!raw || !Array.isArray(raw.levels)|| !Array.isArray(raw.progression)||raw.levels.length>100||raw.progression.length>raw.levels.length)return null;
 if(!raw.levels.every(l=>l&&typeof l==='object'&&typeof l.path==='string'&&l.path.length<160&&typeof l.name==='string'&&l.name.length<250))return null;
 if(new Set(raw.levels.map(l=>l.path)).size!==raw.levels.length)return null;
 let previous=0;
 for(let p of raw.progression){if(!Number.isInteger(p)||p<=previous||p>100)return null; previous=p;}
 return {
   levels:raw.levels.map(l=>({path:l.path,name:l.name,id:String(l.id??''),rank:Math.max(0,Number(l.rank)||0),video:String(l.video||l.verification||''),songname:l.songname||null,songlink:l.songlink||null,creators:Array.isArray(l.creators)?l.creators.slice(0,6):[]})),
   progression:raw.progression.slice(),givenUp:!!raw.givenUp,showRemaining:!!raw.showRemaining,
   useMainList:raw.useMainList!==false,useExtendedList:raw.useExtendedList!==false
 };
}
function saveRoulette(){saveJson(ROULETTE_KEY,S.roulette)}
function shuffleRoulette(list){const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function rouletteMax(){const p=S.roulette.progression;return p.length?p[p.length-1]:0}
function rouletteFinished(){const r=S.roulette;return !!r.levels.length&&(rouletteMax()>=100||r.progression.length>=r.levels.length)}
function rouletteRunning(){const r=S.roulette;return r.levels.length>0&&!r.givenUp&&!rouletteFinished()}
function rouletteStart(){
 const r=S.roulette;
 if(!r.useMainList&&!r.useExtendedList){toast('Select at least one list section.');return}
 if(rouletteRunning()&&!window.confirm('Discard the current roulette and start again?'))return;
 const available=S.levels.filter(l=>!l.pending&&!l.failed&&l.id&&Number.isFinite(Number(l.rank))&&Number(l.rank)>0).sort((a,b)=>a.rank-b.rank);
 const p=S.roulettePool;const sections=available.filter(l=>(r.useMainList&&Number(l.rank)<=100)||(r.useExtendedList&&Number(l.rank)>100));
 const pool=sections.filter(l=>!p.excluded.includes(l.path));
 const forced=pool.filter(l=>p.included.includes(l.path));
 const rest=pool.filter(l=>!p.included.includes(l.path));
 if(!pool.length){toast(S.loading?'Level data is still loading. Try again shortly.':'No eligible levels have loaded for your selection.');return}
 const chosen=shuffleRoulette([...forced,...shuffleRoulette(rest).slice(0,Math.max(0,100-forced.length))]).slice(0,100).map(l=>({path:l.path,name:l.name,id:String(l.id),rank:Number(l.rank),video:l.verification||'',songname:l.song||null,songlink:l.songLink||null,creators:l.creators||[]}));
 S.roulette={levels:chosen,progression:[],givenUp:false,showRemaining:false,useMainList:r.useMainList,useExtendedList:r.useExtendedList};
 saveRoulette();
 if(chosen.length<100)toast(`Started with ${chosen.length} loaded levels. ${S.loading?'The rest are still loading.':'This is the available pool.'}`);
 render({keepScroll:true});
}
function rouletteDone(){
 if(!rouletteRunning())return;
 const input=document.getElementById('roulette-achieved');const achieved=Number(input?.value),target=rouletteMax()+1;
 if(!input||!input.value.trim()||!Number.isInteger(achieved)||achieved<target||achieved>100){
  toast(`Enter a whole-number percentage from ${target} to 100.`);if(input){input.setCustomValidity(`Enter a whole-number percentage from ${target} to 100`);input.reportValidity();input.setCustomValidity('')};return;
 }
 S.roulette.progression.push(achieved);S.roulette.showRemaining=false;
 saveRoulette();render({keepScroll:true});
}
function rouletteGiveUp(){if(!rouletteRunning())return;S.roulette.givenUp=true;S.roulette.showRemaining=false;saveRoulette();render({keepScroll:true})}
function rouletteReset(){if(S.roulette.levels.length&&!window.confirm('Erase your current roulette run?'))return;const r=S.roulette;S.roulette={levels:[],progression:[],givenUp:false,showRemaining:false,useMainList:r.useMainList,useExtendedList:r.useExtendedList};saveRoulette();render({keepScroll:true})}
function rouletteExport(){
 if(!S.roulette.levels.length){toast('Start or import a roulette first.');return}
 const payload={levels:S.roulette.levels,progression:S.roulette.progression,givenUp:S.roulette.givenUp,showRemaining:S.roulette.showRemaining,useMainList:S.roulette.useMainList,useExtendedList:S.roulette.useExtendedList};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='layoutlist_roulette.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function rouletteImportFile(file){
 if(!file)return;
 if(file.size>1024*1024){toast('Roulette file is too large.');return}
 if(rouletteRunning()&&!window.confirm('Replace your current roulette with the imported run?'))return;
 try{let candidate=sanitizeRoulette(JSON.parse(await file.text()));if(!candidate||!candidate.levels.length)throw Error('format');S.roulette=candidate;saveRoulette();render({keepScroll:true});toast('Roulette imported successfully.')}catch{toast('Invalid roulette JSON. Use an exported run from Layout List.')}
}

function roulettePoolPanel(){const inc=S.roulettePool.included,exc=S.roulettePool.excluded;const selected=S.roulettePoolMode==='exclude'?exc:inc;return `<article class="roulette-panel roulette-pool"><h3>Customize level pool</h3><p class="roulette-hint">Required levels always appear when eligible; excluded levels never appear. The remainder is random. Exclusions take priority.</p><div class="buttonrow"><button type="button" class="ghostbutton" data-pool-mode="include" aria-pressed="${S.roulettePoolMode==='include'}">Required (${inc.length})</button><button type="button" class="ghostbutton" data-pool-mode="exclude" aria-pressed="${S.roulettePoolMode==='exclude'}">Removed (${exc.length})</button></div><label for="roulette-pool-search" class="roulette-hint">Search levels to ${S.roulettePoolMode==='include'?'guarantee':'remove'}</label><input id="roulette-pool-search" class="roulette-pool-search" type="search" placeholder="Level name or ID…" value="${esc(S.roulettePoolSearch)}"><div class="roulette-pool-options">${roulettePoolMatches().map(l=>`<button type="button" data-pool-add="${esc(l.path)}">#${fmt(l.rank)} ${esc(l.name)} <strong>${selected.includes(l.path)?'✓':S.roulettePoolMode==='exclude'?'Remove +':'Add +'}</strong></button>`).join('')||'<p style="padding:10px">No matches loaded.</p>'}</div><h3>${S.roulettePoolMode==='include'?'Guaranteed':'Removed'} levels</h3><div>${selected.length?selected.map(sl=>{const l=S.levels.find(l=>l.path===sl);return `<div class="roulette-chip"><span>${esc(l?.name||displaySlug(sl))}</span><button type="button" title="Remove from selection" data-pool-remove="${esc(sl)}">×</button></div>`}).join(''):'<p class="roulette-hint">No levels selected.</p>'}</div></article>`}

function submitPage(){let choices=S.levels.filter(l=>l.path&&l.id).map(l=>`<option value="${esc(l.path)}" ${S.submitLevel===l.path?'selected':''}>#${fmt(l.rank)}: ${esc(l.name)} (${esc(tier(l))})</option>`).join('');return `<div class="container"><section class="form-panel"><h1>Submit a record</h1><p>Submit your Layout List run for review. Records remain <strong>pending</strong> until an admin accepts them. Site approval does not update the official Layout List GitHub repository.</p><div class="form-alert ${S.submitError?'error':''}" role="status" id="submit-feedback" ${S.submitAlert?'':'hidden'}>${esc(S.submitAlert)}</div><form id="record-form" class="form-grid"><div class="field wide"><label for="record-level">Layout *</label><select name="levelSlug" id="record-level" required><option value="">Select a layout</option>${choices}</select><small>Only levels currently listed by the Layout List are valid.</small></div><div class="field"><label for="player-name">Your Geometry Dash username *</label><input id="player-name" name="playerName" required minlength="2" maxlength="50" autocomplete="nickname" placeholder="Your player name"></div><div class="field"><label for="record-percent">Progress percentage *</label><input id="record-percent" name="percentage" type="number" inputmode="numeric" min="1" max="100" step="1" required placeholder="100"></div><div class="field"><label for="record-hz">Refresh rate (Hz)</label><input id="record-hz" name="hz" type="number" min="1" max="10000" step="1" placeholder="240"></div><div class="field"><label for="record-enjoyment">Enjoyment (0–10, optional)</label><input id="record-enjoyment" name="enjoyment" type="number" min="0" max="10" step="1" placeholder="8"></div><div class="field wide"><label for="record-proof">Proof video (HTTPS URL) *</label><input id="record-proof" name="videoUrl" required type="url" pattern="https://.*" placeholder="https://youtu.be/..." maxlength="500"><small>Paste an accessible video link. A proof link is required; uploads are not hosted here.</small></div><div class="field wide"><label for="record-comments">Comments (optional)</label><textarea id="record-comments" name="comments" maxlength="800" placeholder="Any details the reviewer should know"></textarea></div><div class="field" hidden aria-hidden="true"><label for="form-site">Website</label><input id="form-site" name="website" tabindex="-1" autocomplete="off"></div><div class="field wide" id="turnstile-container"></div><div class="field wide"><label style="display:flex;align-items:flex-start;gap:8px;font-weight:450"><input style="width:auto;min-height:auto;margin:5px 0" type="checkbox" required name="confirm">I confirm this submission is genuine and that I have permission to share its proof link.</label></div><div class="field wide"><button class="primary-action" type="submit" id="submit-record-button">Submit for review</button></div></form><p class="security-note">Spam protection and proof validation run on the server. Your submission does not appear publicly until approved.</p></section></div>`}

function thumbnailEditorPanel(){
 const t=S.thumbnailEditor;
 const level=S.levels.find(l=>l.path===t.slug)||S.levels[0];
 if(!level)return '';
 const url=t.url || thumbFor(level);
 const options=S.levels.map(l=>`<option value="${esc(l.path)}" ${l.path===level.path?'selected':''}>#${fmt(l.rank)} – ${esc(l.name||displaySlug(l.path))}</option>`).join('');
 return `<section class="thumbnail-admin" aria-labelledby="thumbnail-editor-heading">
   <h2 id="thumbnail-editor-heading">Level thumbnail overrides</h2>
   <p>Admin-only. Add a public HTTPS image URL to replace a level's thumbnail on the list and detail page. Clicking that image will still open the original verification video. The official Layout List source is unchanged.</p>
   ${t.message?`<p role="status" style="color:${t.error?'#e68787':'var(--accent)'}">${esc(t.message)}</p>`:''}
   <form id="thumbnail-editor-form">
     <div class="thumbnail-fields"><div><label for="thumbnail-level">Level</label><select id="thumbnail-level" required>${options}</select></div>
     <div><label for="thumbnail-url">Replacement image URL (HTTPS)</label><input id="thumbnail-url" type="url" maxlength="500" autocomplete="off" placeholder="https://.../thumbnail.webp" value="${esc(t.url)}"></div></div>
     <div class="thumbnail-preview-wrap"><img id="thumbnail-admin-preview" src="${esc(url)}" alt="Current thumbnail preview" onerror="this.style.opacity='.25'"/><small>Leave blank to keep the verification video's default thumbnail. Supported: publicly accessible HTTPS image links (JPG, PNG, WebP, GIF). Changes appear for all visitors when the backend is deployed.</small></div>
     <div class="reviewactions"><button class="primary-action" type="submit" ${t.busy?'disabled':''}>Save thumbnail</button><button class="secondary-action" type="button" data-thumbnail-clear ${t.busy?'disabled':''}>Restore automatic thumbnail</button></div>
   </form>
 </section>`;
}
async function loadThumbnails(){
 try{
  const response=await fetch('/api/thumbnails',{credentials:'same-origin',cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  const fresh={};
  for(const item of data.thumbnails||[])if(/^[a-z0-9_]{1,70}$/.test(item.levelSlug)&&safeMediaUrl(item.imageUrl))fresh[item.levelSlug]=item.imageUrl;
  S.thumbnailOverrides=fresh;
  S.thumbnailEditor.url=fresh[S.thumbnailEditor.slug]||'';
  render({keepScroll:true});
 }catch{} // Static HTML preview has no API; silently keep automatic YouTube thumbnails.
}
async function saveThumbnailOverride(clear=false){
 const editor=S.thumbnailEditor;
 const levelSlug=document.getElementById('thumbnail-level')?.value||editor.slug;
 const imageUrl=clear?'':document.getElementById('thumbnail-url')?.value.trim()||'';
 if(!clear&&!safeMediaUrl(imageUrl)){editor.message='Enter a valid public HTTPS image URL, or choose Restore automatic thumbnail.';editor.error=true;render({keepScroll:true});return;}
 editor.slug=levelSlug;editor.url=imageUrl;editor.busy=true;editor.message='';render({keepScroll:true});
 try{
  const response=await fetch('/api/admin/thumbnails',{method:clear?'DELETE':'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(clear?{levelSlug}:{levelSlug,imageUrl})});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Could not update thumbnail.');
  editor.message=clear?'Automatic thumbnail restored.':'Thumbnail updated for everyone visiting the deployed site.';editor.error=false;
  await loadThumbnails();
  editor.url=S.thumbnailOverrides[levelSlug]||'';
 }catch(err){editor.message=err.message;editor.error=true;}
 finally{editor.busy=false;render({keepScroll:true});}
}

function adminPage(){const a=S.admin;const isLogged=!!a.user;let control=isLogged?`<div class="admin-summary"><span>Signed in as <strong>${esc(a.user)}</strong></span><button class="secondary-action" data-admin-logout>Log out</button></div><div class="admin-summary">${['pending','accepted','rejected'].map(s=>`<button class="secondary-action" data-admin-filter="${s}" aria-pressed="${s===a.status}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div><p>${fmt(a.total)} ${esc(a.status)} submissions</p>${a.items.map(x=>`<article class="reviewcard" data-id="${x.id}"><h3>${esc(x.player_name)}: ${x.percentage}% on ${esc(x.level_name)}</h3><div class="reviewmeta"><span>#${x.id} · ${esc(x.level_slug)}</span><span>GD ID: ${esc(x.gd_level_id||'N/A')}</span><span>${new Date(x.created_at*1000).toLocaleString()}</span>${x.hz?`<span>${x.hz} Hz</span>`:''}</div><p><a href="${esc(x.video_url)}" target="_blank" rel="noopener noreferrer">Watch submitted proof ↗</a></p>${x.comments?`<p>Submitter note: ${esc(x.comments)}</p>`:''}${x.status==='pending'?`<textarea class="review-note" maxlength="500" placeholder="Review note (required when rejecting)" aria-label="Review note for submission ${x.id}"></textarea><div class="reviewactions"><button class="primary-action" data-review="accepted" data-id="${x.id}">Accept</button><button class="secondary-action danger-action" data-review="rejected" data-id="${x.id}">Reject</button></div>`:`<p class="info-line">${esc(x.status)} by ${esc(x.reviewed_by||'admin')} ${x.reviewer_note?': '+esc(x.reviewer_note):''}</p>`}</article>`).join('')||'<p class="info-line">Nothing in this queue.</p>'}<div class="reviewactions"><button class="secondary-action" data-admin-page="prev" ${a.offset<=0?'disabled':''}>Previous</button><span class="info-line">Showing ${a.total?fmt(a.offset+1):0}–${fmt(Math.min(a.offset+100,a.total))} of ${fmt(a.total)}</span><button class="secondary-action" data-admin-page="next" ${a.offset+100>=a.total?'disabled':''}>Next</button></div>`:`<p>Only authorized list moderators can review submissions.</p><form id="admin-login-form" class="form-grid"><div class="field wide"><label for="admin-user">Admin username</label><input id="admin-user" name="username" autocomplete="username" required></div><div class="field wide"><label for="admin-password">Password</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required></div><div class="field wide"><button class="primary-action" type="submit">Sign in</button></div></form>`;return `<div class="container"><section class="admin-panel"><h1>Record moderation</h1><p>Private queue for submissions received through this site.</p>${a.error?`<div class="form-alert error" role="alert">${esc(a.error)}</div>`:''}${control}${isLogged?thumbnailEditorPanel()+clanEditorPanel():''}</section></div>`}
function mergeApprovedLevel(l){if(!l)return;const base=l._officialRecords||l.records||[];l._officialRecords=base.filter(r=>!r.siteApproved);const extra=S.approved.filter(r=>r.levelSlug===l.path&&!base.some(b=>String(b.user||'').toLowerCase()===String(r.user).toLowerCase()&&Number(b.percent)===Number(r.percent)));l.records=[...l._officialRecords,...extra]}
function mergeApproved(){for(const l of S.levels)mergeApprovedLevel(l)}
async function loadApproved(){try{let r=await fetch('/api/records',{credentials:'same-origin'});if(!r.ok)return;let result=await r.json();S.approved=Array.isArray(result.records)?result.records:[];mergeApproved();render({keepScroll:true})}catch{}}
let configLoaded=false,turnstileSiteKey='';
async function loadConfig(){if(configLoaded)return;configLoaded=true;try{let res=await fetch('/api/config');if(res.ok){let j=await res.json();turnstileSiteKey=j.turnstileSiteKey||'';if(turnstileSiteKey){let js=document.createElement('script');js.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';js.async=true;js.onload=mountTurnstile;document.head.appendChild(js)}}}catch{}}
function mountTurnstile(){let el=document.getElementById('turnstile-container');if(el&&turnstileSiteKey&&window.turnstile&&!el.dataset.mounted){el.dataset.mounted='1';window.turnstile.render(el,{sitekey:turnstileSiteKey,theme:S.light?'light':'dark'})}}
async function submitRecord(form){let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Submitting…';const data=Object.fromEntries(new FormData(form));data.turnstileToken=form.querySelector('[name="cf-turnstile-response"]')?.value||'';try{let r=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);S.submitError=false;S.submitAlert=`Submission #${j.id} received. Status: pending administrator review.`;render({keepScroll:true})}catch(e){S.submitError=true;S.submitAlert=e.message;let feedback=document.getElementById('submit-feedback');if(feedback){feedback.hidden=false;feedback.textContent=S.submitAlert;feedback.classList.add('error')}btn.disabled=false;btn.textContent='Submit for review'}}
async function adminLogin(form){let btn=form.querySelector('button');btn.disabled=true;try{let data=Object.fromEntries(new FormData(form));let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');S.admin.user=j.username;S.admin.error='';loadAdmin()}catch(e){S.admin.error=e.message;render({keepScroll:true})}finally{btn.disabled=false}}
async function loadAdmin(){if(S.page!=='admin')return;try{let r=await fetch(`/api/admin/records?status=${encodeURIComponent(S.admin.status)}&offset=${S.admin.offset}`,{credentials:'same-origin'});if(r.status===401){S.admin.user='';S.admin.items=[];S.admin.error='';render({keepScroll:true});return}let j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load moderation queue');S.admin.user=S.admin.user||'Administrator';S.admin.items=j.items||[];S.admin.total=j.total||0;S.admin.error='';render({keepScroll:true})}catch(e){S.admin.error=e.message;render({keepScroll:true})}}
async function reviewRecord(status,id,card){if(!card)return;let note=card.querySelector('.review-note')?.value.trim()||'';if(status==='rejected'&&!note){toast('Enter a rejection reason first');card.querySelector('.review-note')?.focus();return}const btns=card.querySelectorAll('button');btns.forEach(b=>b.disabled=true);try{let r=await fetch('/api/admin/records/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({status,note})});let j=await r.json();if(!r.ok)throw Error(j.error||'Review failed');toast('Record '+status);await loadAdmin();if(status==='accepted')await loadApproved()}catch(e){toast(e.message);btns.forEach(b=>b.disabled=false)}}
async function adminLogout(){try{await fetch('/api/admin/session',{method:'DELETE',credentials:'same-origin'})}catch{}S.admin.user='';S.admin.items=[];render({keepScroll:true})}
document.addEventListener('submit',e=>{if(e.target.id==='thumbnail-editor-form'){e.preventDefault();saveThumbnailOverride(false);return;}});
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();submitRecord(e.target)}if(e.target.id==='admin-login-form'){e.preventDefault();adminLogin(e.target)}});

fromHash();render();loadLive();loadApproved();loadThumbnails();loadClans();if(S.page==='admin')loadAdmin();if(S.page==='submit')loadConfig();

</script>
